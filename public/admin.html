<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel - Sora Pedia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛠️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="adm-wrap">
  <div class="card login-card">
    <div class="logo" style="margin-bottom:6px"><span class="mk"><svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg></span><span><b>SORA</b> PEDIA</span></div>
    <h1 style="font-size:22px;margin:10px 0 4px">Admin Panel</h1>
    <p class="hint">Masuk dengan akun admin.</p>
    <label for="ae">Email</label><input id="ae" type="email" autocomplete="username">
    <label for="ap">Password</label><input id="ap" type="password" autocomplete="current-password">
    <p class="err" id="aerr" role="alert"></p>
    <button class="btn btn-full" id="ago">Masuk</button>
    <p style="margin-top:14px;text-align:center"><a href="/" class="hint">Kembali ke website</a></p>
  </div>
</div>

<div id="panel" class="adm-wrap hidden">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap">
    <div class="logo"><span class="mk"><svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg></span><span><b>SORA</b> PEDIA &middot; Admin</span></div>
    <div style="display:flex;gap:8px"><a class="btn btn-ghost btn-sm" href="/">Lihat website</a><button class="btn btn-danger btn-sm" id="alogout">Keluar</button></div>
  </div>
  <div class="adm-tabs" id="tabs" role="tablist"></div>
  <div id="content"></div>
</div>
<script src="/admin.js"></script>
</body>
</html>
